# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(043564)

general {
    border_size = 1
    col.active_border = $activeBorderColor
    col.inactive_border = rgb(F9F4E0)
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    rounding = 4
    rounding_power = 2

    active_opacity = 0.92
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 4
        color = rgba(90A5A733)
        color_inactive = rgba(4C626422)
    }

    blur {
        enabled = true
		ignore_opacity = false
		size = 1
		brightness = 0.9
    }
}

# Keep image viewers / video players / media tools fully opaque.
# `override` stops the value from multiplying with active_opacity above
# (omarchy exempts these from its tag-opacity, but our global opacity bled in).
windowrule = opacity 1.0 override 1.0 override, match:class ^(imv|mpv|vlc|org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|zoom|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta)$

# GTK apps (color/content-critical): force fully opaque.
windowrule = opacity 1.0 override 1.0 override, match:class ^(gimp|com.github.xournalpp.xournalpp|nwg-look|system-config-printer)$
